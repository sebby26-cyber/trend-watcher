<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trend Watch — catch the signal before the crowd">
  <title>Trend Watch</title>
  <desc>An always-on research watcher that surfaces fresh, rising signals from public sources.</desc>
  <defs>
    <linearGradient id="tw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#10151F"/>
    </linearGradient>
    <linearGradient id="tw-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#3DDC97" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#tw-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#222A38" stroke-width="1"/>

  <!-- instrument grid -->
  <g stroke="#19202C" stroke-width="1">
    <line x1="120" y1="28" x2="120" y2="332"/>
    <line x1="280" y1="28" x2="280" y2="332"/>
    <line x1="440" y1="28" x2="440" y2="332"/>
    <line x1="600" y1="28" x2="600" y2="332"/>
    <line x1="760" y1="28" x2="760" y2="332"/>
    <line x1="920" y1="28" x2="920" y2="332"/>
    <line x1="1080" y1="28" x2="1080" y2="332"/>
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
  </g>

  <!-- mark: noise floor -> rising signal -> radar ping -->
  <g transform="translate(78,96) scale(2.7)">
    <path d="M45.74,2.20 A13,13 0 0 1 60.80,17.26" stroke="#F5A623" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
    <path d="M46.44,6.14 A9,9 0 0 1 56.86,16.56" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M6,44 L10,42 L14,45 L18,43 L22,44 L26,42 L30,44 L34,43 L38,43" stroke="#7D8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38,43 C43,43 46,34 48,15" stroke="#3DDC97" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="48" cy="15" r="4.6" fill="#3DDC97" opacity="0.22"/>
    <circle cx="48" cy="15" r="2.7" fill="#3DDC97"/>
  </g>

