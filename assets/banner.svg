" fill="#E6EAF2"/>
  <rect x="922" y="112" width="18" height="56" fill="#3DDC97" opacity="0.9"/>

  <!-- tagline -->
  <text x="332" y="218" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#AEB7C6">Catch the signal before the crowd — then decide for yourself.</text>

  <!-- rule -->
  <rect x="332" y="248" width="620" height="2" fill="url(#tw-rule)" opacity="0.6"/>

  <!-- promise line -->
  <text x="332" y="286" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" fill="#7D8798">always-on research  ·  zero dependencies  ·  <tspan fill="#3DDC97">signal only</tspan></text>
</svg>
